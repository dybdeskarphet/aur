name: Update README Package Table

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'README_TEMPLATE.md'
      - 'scripts/update_readme.py'
      - '**/PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run README updater with uv
        run: uv run scripts/update_readme.py

      - name: Commit & Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs(readme): update package status table"
            git push origin main
          else
            echo "README.md is already up to date."
          fi
