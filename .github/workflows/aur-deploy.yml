name: Deploy Packages to AUR

on:
  workflow_run:
    workflows: ["Check Upstream Updates & Verify Build"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

jobs:
  sync-aur:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish changed packages to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: AUR_SSH_PRIVATE_KEY secret is not set!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H aur.archlinux.org 2>/dev/null >> ~/.ssh/known_hosts

          git config --global user.name "Ahmet Arda Kavakci"
          git config --global user.email "ahmetardakavakci@gmail.com"

          ALL_PACKAGES=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            CHANGED_DIRS="$ALL_PACKAGES"
          else
            CHANGED_DIRS=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^packages/' | cut -d/ -f2 | sort -u)
            HAS_PKG=false
            for d in $CHANGED_DIRS; do
              if [ -f "packages/$d/PKGBUILD" ]; then
                HAS_PKG=true
                break
              fi
            done
            if [ "$HAS_PKG" = "false" ]; then
              CHANGED_DIRS="$ALL_PACKAGES"
            fi
          fi

          echo "Target package directories: $CHANGED_DIRS"

          for pkg in $CHANGED_DIRS; do
            if [ ! -f "packages/$pkg/PKGBUILD" ]; then
              continue
            fi

            echo "=========================================="
            echo "Processing changed package: $pkg"
            echo "=========================================="

            PKG_COMMIT_MSG=$(git log -1 --pretty=format:"%s" -- "packages/$pkg/")
            CLEAN_MSG=$(echo "${PKG_COMMIT_MSG:-Update package}" | sed -E "s/^[a-zA-Z0-9_-]*\($pkg\):\s*//; s/^$pkg:\s*//")

            echo "Cloning AUR repository ssh://aur@aur.archlinux.org/$pkg.git..."
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur_$pkg"

            rsync -av --delete \
              --exclude='.git' \
              --exclude='*.pkg.tar.*' \
              --exclude='src/' \
              --exclude='pkg/' \
              "packages/$pkg/" "aur_$pkg/"

            cd "aur_$pkg"

            if [ -n "$(git status --porcelain)" ]; then
              echo "Diff detected in $pkg. Committing and pushing to AUR..."
              git add .
              git commit -m "$CLEAN_MSG"
              git push origin master
              echo "SUCCESS: Pushed changes to AUR ($pkg)."
            else
              echo "SKIP: No diffs detected for $pkg in AUR repo."
            fi

            cd "$GITHUB_WORKSPACE"
          done
