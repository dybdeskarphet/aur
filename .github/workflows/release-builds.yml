name: Build & Publish Pacman Repository

on:
  workflow_run:
    workflows: ["Check Upstream Updates & Verify Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --needed --noconfirm base-devel git github-cli jq pacman-contrib sudo rsync

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure safe directory & builder user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages & update repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: "dybdeskarphet"
          RELEASE_TAG: "packages"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/dist"

          echo "=========================================="
          echo "Fetching existing repository assets..."
          echo "=========================================="
          # Download all existing packages & databases from the 'packages' release if it exists
          gh release download "$RELEASE_TAG" --dir "$GITHUB_WORKSPACE/dist" 2>/dev/null || echo "No existing 'packages' release found. Initializing new repository."

          cd "$GITHUB_WORKSPACE"
          ALL_PACKAGES=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)

          if [ -z "$ALL_PACKAGES" ]; then
            echo "No package directories found in packages/."
            exit 0
          fi

          NEWLY_BUILT=false

          for pkg in $ALL_PACKAGES; do
            PKGBUILD_PATH="packages/$pkg/PKGBUILD"
            if [ ! -f "$PKGBUILD_PATH" ]; then
              continue
            fi

            PKGVER=$(grep '^pkgver=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
            PKGREL=$(grep '^pkgrel=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
            EXPECTED_PREFIX="${pkg}-${PKGVER}-${PKGREL}"

            # Check if this exact package binary already exists in dist/
            if ls "$GITHUB_WORKSPACE/dist/${EXPECTED_PREFIX}-"*.pkg.tar.* 1>/dev/null 2>&1; then
              echo "SKIP: $EXPECTED_PREFIX is already built and up-to-date in repository."
            else
              echo "=========================================="
              echo "Building: $pkg ($PKGVER-$PKGREL)"
              echo "=========================================="

              # Remove old versions of this package from dist/
              rm -f "$GITHUB_WORKSPACE/dist/${pkg}-"*.pkg.tar.* || true

              cd "$GITHUB_WORKSPACE/packages/$pkg"
              TARGET_PKGS=$(su builder -c "makepkg --packagelist" 2>/dev/null || true)

              if su builder -c "makepkg -s --noconfirm"; then
                echo "SUCCESS: Built $pkg successfully!"
                NEWLY_BUILT=true

                if [ -n "$TARGET_PKGS" ]; then
                  for f in $TARGET_PKGS; do
                    if [ -f "$f" ]; then
                      cp "$f" "$GITHUB_WORKSPACE/dist/"
                    fi
                  done
                fi
                cp *.pkg.tar.* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

                su builder -c "makepkg -c --noconfirm" || true
                rm -f *.pkg.tar.*
              else
                echo "ERROR: Build failed for $pkg!"
              fi
              cd "$GITHUB_WORKSPACE"
            fi
          done

          cd "$GITHUB_WORKSPACE/dist"
          AVAILABLE_PKGS=$(ls *.pkg.tar.* 2>/dev/null | grep -v "\.db" | grep -v "\.files" || true)

          if [ -z "$AVAILABLE_PKGS" ]; then
            echo "No package binaries available in dist/. Skipping repository publication."
            exit 0
          fi

          echo "=========================================="
          echo "Generating Pacman repository database..."
          echo "=========================================="
          # Recreate repository database fresh from all available packages
          rm -f "${REPO_NAME}".db* "${REPO_NAME}".files*
          repo-add "${REPO_NAME}.db.tar.zst" *.pkg.tar.*

          # Remove symlinks created by repo-add and replace with real file copies
          rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"
          cp -f "${REPO_NAME}.db.tar.zst" "${REPO_NAME}.db"
          cp -f "${REPO_NAME}.files.tar.zst" "${REPO_NAME}.files"

          echo "=========================================="
          echo "Publishing to GitHub Release ($RELEASE_TAG)..."
          echo "=========================================="

          # Generate release notes with pacman.conf instructions & package list
          {
            echo "### 📦 Arch Linux Custom Pacman Repository"
            echo ""
            echo "This release hosts pre-compiled binary packages and the Pacman repository database for \`$REPO_NAME\`."
            echo ""
            echo "#### ⚙️ How to Add to \`/etc/pacman.conf\`"
            echo "\`\`\`ini"
            echo "[$REPO_NAME]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
            echo "\`\`\`"
            echo ""
            echo "Then run: \`sudo pacman -Syy\`"
            echo ""
            echo "#### 📋 Available Packages in this Repository"
            echo ""
            echo "| Package | File |"
            echo "| :--- | :--- |"
            for f in *.pkg.tar.*; do
              if [[ "$f" != *.db* && "$f" != *.files* ]]; then
                echo "| **${f%%-*-*-*}** | \`$f\` |"
              fi
            done
            echo ""
            echo "---"
            echo "_Automated Pacman repository maintained by GitHub Actions._"
          } > "$GITHUB_WORKSPACE/release_notes.md"

          # Create or update the release
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating initial release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"/* \
              --title "Arch Linux Pacman Repository ($REPO_NAME)" \
              --notes-file "$GITHUB_WORKSPACE/release_notes.md"
          else
            echo "Updating existing release: $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" \
              --title "Arch Linux Pacman Repository ($REPO_NAME)" \
              --notes-file "$GITHUB_WORKSPACE/release_notes.md"

            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"/* --clobber
          fi

          echo "SUCCESS: Pacman repository published successfully!"
