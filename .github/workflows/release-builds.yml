name: Build & Publish Release Packages

on:
  workflow_run:
    workflows: ["Check Upstream Updates & Verify Build"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --needed --noconfirm base-devel git github-cli jq pacman-contrib sudo rsync

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure safe directory & builder user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Detect Unreleased Packages & Create Batch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALL_PACKAGES=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)

          if [ -z "$ALL_PACKAGES" ]; then
            echo "No package directories found in packages/. Skipping release."
            exit 0
          fi

          echo "Scanning packages: $ALL_PACKAGES"

          # Query asset filenames across all GitHub releases (using --paginate for complete history)
          RELEASE_ASSETS=$(gh api repos/:owner/:repo/releases --paginate --jq '.[].assets[].name' 2>/dev/null || true)

          TO_BUILD=""
          for pkg in $ALL_PACKAGES; do
            PKGBUILD_PATH="packages/$pkg/PKGBUILD"
            if [ ! -f "$PKGBUILD_PATH" ]; then
              echo "SKIP: No PKGBUILD found for $pkg."
              continue
            fi

            # Extract version from PKGBUILD
            PKGVER=$(grep '^pkgver=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
            PKGREL=$(grep '^pkgrel=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
            
            EXPECTED_PREFIX="${pkg}-${PKGVER}-${PKGREL}"

            # Exact matching against published package filenames (e.g. gams-54.2.2-1-x86_64.pkg.tar.zst)
            if [ -n "$RELEASE_ASSETS" ] && echo "$RELEASE_ASSETS" | grep -q "^${EXPECTED_PREFIX}-"; then
              echo "SKIP: $EXPECTED_PREFIX is already published in GitHub Releases."
            else
              echo "UNRELEASED: $pkg ($PKGVER-$PKGREL) needs to be built and released!"
              TO_BUILD="$TO_BUILD $pkg"
            fi
          done

          if [ -z "$TO_BUILD" ]; then
            echo "All packages in packages/ are already published to GitHub Releases."
            echo "No new release tag will be created."
            exit 0
          fi

          echo "Packages scheduled for build and release: $TO_BUILD"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          BUILT_PACKAGES=""

          for pkg in $TO_BUILD; do
            echo "=========================================="
            echo "Building package binary for: $pkg"
            echo "=========================================="

            cd "$GITHUB_WORKSPACE/packages/$pkg"
            if su builder -c "makepkg -s --noconfirm"; then
              echo "SUCCESS: Built $pkg successfully!"
              cp *.pkg.tar.* "$GITHUB_WORKSPACE/dist/"
              su builder -c "makepkg -c --noconfirm" || true
              rm -f *.pkg.tar.*
              BUILT_PACKAGES="$BUILT_PACKAGES $pkg"
            else
              echo "ERROR: makepkg failed for $pkg!"
            fi
            cd "$GITHUB_WORKSPACE"
          done

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/dist"/*.pkg.tar.* 2>/dev/null)" ]; then
            echo "No package binaries were built successfully. Skipping batch release creation."
            exit 0
          fi

          RELEASE_TAG="build-$(date -u +'%Y.%m.%d-%H%M%S')"
          RELEASE_TITLE="Package Release — $(date -u +'%Y-%m-%d %H:%M UTC')"

          {
            echo "### 📦 Published Packages in this Release"
            echo ""
            echo "| Package | Version | Description |"
            echo "| :--- | :--- | :--- |"
            for pkg in $BUILT_PACKAGES; do
              PKGBUILD_PATH="packages/$pkg/PKGBUILD"
              PKGVER=$(grep '^pkgver=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
              PKGREL=$(grep '^pkgrel=' "$PKGBUILD_PATH" | cut -d= -f2 | tr -d "'\" ")
              PKGDESC=$(grep '^pkgdesc=' "$PKGBUILD_PATH" | head -n1 | cut -d= -f2- | tr -d "'\"")
              echo "| **$pkg** | \`${PKGVER}-${PKGREL}\` | $PKGDESC |"
            done
            echo ""
            echo "---"
            echo "_Automated batch release created by GitHub Actions._"
          } > "$GITHUB_WORKSPACE/release_notes.md"

          echo "Publishing Batch GitHub Release: $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"/*.pkg.tar.* \
            --title "$RELEASE_TITLE" \
            --notes-file "$GITHUB_WORKSPACE/release_notes.md"

          echo "SUCCESS: Created batch release $RELEASE_TAG!"
